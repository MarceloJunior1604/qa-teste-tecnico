name: Performance Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Rodar testes de performance
        run: mvn test -Pperformance -pl performance-tests

      - name: Publicar relatorio HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: performance-tests/target/reports/

      - name: Exibir link do relatorio
        if: always()
        run: |
          echo "## Relatorio de Performance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Baixe o artefato **performance-reports** acima e abra o index.html direto (o dashboard do JMeter abre sozinho, sem servidor)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Isso e o resultado desta execucao. O snapshot no README/Pages pode ser de uma execucao anterior." >> "$GITHUB_STEP_SUMMARY"