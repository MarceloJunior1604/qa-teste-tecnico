name: API Tests

on:
  push:
    paths:
      - 'api-tests/**'
  pull_request:
    paths:
      - 'api-tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Rodar testes de API
        run: mvn test -pl api-tests

      - name: Gerar relatorio Allure
        if: always()
        run: mvn -pl api-tests allure:report

      - name: Publicar relatorio Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: api-tests/target/site/allure-maven-plugin/