name: API Tests

on:
  push:
    paths:
      - 'api-tests/**'
  pull_request:
    paths:
      - 'api-tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Rodar testes de API
        run: mvn test -pl api-tests