name: API Tests

on:
  push:
    paths:
      - 'api-tests/**'
  pull_request:
    paths:
      - 'api-tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Rodar testes de API
        run: mvn test -pl api-tests

      - name: Gerar relatorio Allure
        if: always()
        run: mvn -pl api-tests allure:report

      - name: Publicar relatorio Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: api-tests/target/site/allure-maven-plugin/

      - name: Exibir link do relatorio
        if: always()
        run: |
          echo "## Relatorio da API" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Versao mais atualizada (publicada a cada push na main):" >> "$GITHUB_STEP_SUMMARY"
          echo "https://marcelojunior1604.github.io/qa-teste-tecnico/api/index.html" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "O artefato **allure-report-api** (aba Artifacts acima) tem o relatorio bruto desta execucao especifica, mas precisa ser servido por HTTP pra abrir (o Allure nao funciona com duplo clique direto no arquivo)." >> "$GITHUB_STEP_SUMMARY"