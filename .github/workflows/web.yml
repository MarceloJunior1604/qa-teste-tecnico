name: Web Tests

on:
  push:
    paths:
      - 'web-tests/**'
  pull_request:
    paths:
      - 'web-tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Rodar testes Web
        run: mvn test -pl web-tests -Dheadless=true

      - name: Gerar relatorio Allure
        if: always()
        run: mvn -pl web-tests allure:report

      - name: Publicar relatorio Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-web
          path: web-tests/target/site/allure-maven-plugin/